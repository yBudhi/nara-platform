services:
  db:
    image: postgres:16
    container_name: nara-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NARA_OWNER_USER: ${NARA_OWNER_USER:-nara_owner}
      NARA_MIGRATOR_USER: ${NARA_MIGRATOR_USER:-nara_migrator}
      NARA_MIGRATOR_PASSWORD: ${NARA_MIGRATOR_PASSWORD}
      NARA_RUNTIME_USER: ${NARA_RUNTIME_USER:-nara_runtime}
      NARA_RUNTIME_PASSWORD: ${NARA_RUNTIME_PASSWORD}

    volumes:
      - nara_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/repair:/opt/nara/repair:ro

    networks:
      - nara-net

    mem_limit: 512m
    cpus: 0.75
    shm_size: 128mb

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nara-backend:local
    container_name: nara-migrate
    restart: "no"

    environment:
      ALEMBIC_DATABASE_URL: postgresql+psycopg://${NARA_MIGRATOR_USER:-nara_migrator}:${NARA_MIGRATOR_PASSWORD}@db:5432/${POSTGRES_DB}
      ALEMBIC_MIGRATOR_ROLE: ${NARA_MIGRATOR_USER:-nara_migrator}
      ALEMBIC_OWNER_ROLE: ${NARA_OWNER_USER:-nara_owner}

    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]

    depends_on:
      db:
        condition: service_healthy

    networks:
      - nara-net

    mem_limit: 256m
    cpus: 0.5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: nara-backend:local

    container_name: nara-api
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+psycopg://${NARA_RUNTIME_USER:-nara_runtime}:${NARA_RUNTIME_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}

    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    networks:
      - nara-net

    ports:
      - "127.0.0.1:8000:8000"

    mem_limit: 384m
    cpus: 0.5

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nara_pgdata:
    name: nara_pgdata

networks:
  nara-net:
    name: nara-net
    driver: bridge
